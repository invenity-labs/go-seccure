# goreleaser configuration — see https://goreleaser.com
#
# Triggered by `git push --tags` for any tag matching v*.*.*. The
# .github/workflows/release.yml runs goreleaser; it cross-compiles the eight
# CLI binaries for five platforms, generates SBOMs (SPDX-JSON, one per
# archive), computes SHA-256 checksums, and creates a GitHub Release with
# every artefact attached.

version: 2

project_name: go-seccure

# No `before:` hooks. The module has zero third-party deps, so `go mod
# tidy` / `go mod download` do nothing useful — and any file they touch
# (even a no-op rewrite of go.sum) marks the tree as VCS-dirty at compile
# time, which makes Go's BuildInfo stamp every binary with a `+dirty`
# version suffix that security scanners flag as a build-hygiene issue.

builds:
  # One build entry per CLI binary. The matrix below produces 5 binaries each
  # (linux amd64/arm64, darwin amd64/arm64, windows amd64), so 8 × 5 = 40
  # binaries total. The archives section groups them into 5 per-platform
  # archives.
  - id: seccure-key
    binary: seccure-key
    main: ./cmd/seccure-key
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64        # not yet a release target
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

  - id: seccure-encrypt
    binary: seccure-encrypt
    main: ./cmd/seccure-encrypt
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore: [{goos: windows, goarch: arm64}]
    ldflags: [-s -w]

  - id: seccure-decrypt
    binary: seccure-decrypt
    main: ./cmd/seccure-decrypt
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore: [{goos: windows, goarch: arm64}]
    ldflags: [-s -w]

  - id: seccure-sign
    binary: seccure-sign
    main: ./cmd/seccure-sign
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore: [{goos: windows, goarch: arm64}]
    ldflags: [-s -w]

  - id: seccure-verify
    binary: seccure-verify
    main: ./cmd/seccure-verify
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore: [{goos: windows, goarch: arm64}]
    ldflags: [-s -w]

  - id: seccure-dh
    binary: seccure-dh
    main: ./cmd/seccure-dh
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore: [{goos: windows, goarch: arm64}]
    ldflags: [-s -w]

  - id: seccure-signcrypt
    binary: seccure-signcrypt
    main: ./cmd/seccure-signcrypt
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore: [{goos: windows, goarch: arm64}]
    ldflags: [-s -w]

  - id: seccure-veridec
    binary: seccure-veridec
    main: ./cmd/seccure-veridec
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore: [{goos: windows, goarch: arm64}]
    ldflags: [-s -w]

archives:
  - id: default
    # One archive per (os, arch) containing all 8 CLI binaries plus the
    # README, LICENSE, and NOTICE. zip on Windows, tar.gz elsewhere.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

sboms:
  - id: archives
    # goreleaser invokes syft against each archive and attaches the result
    # as a sibling file (e.g. seccure_v0.1.0_linux_amd64.tar.gz.sbom.json).
    # SPDX-JSON is the format most downstream supply-chain tools expect.
    artifacts: archive
    documents: ['${artifact}.sbom.json']
    cmd: syft
    args: ['$artifact', '--output', 'spdx-json=$document']

  - id: source
    # Also emit an SBOM for the source tarball goreleaser produces. This
    # captures the dependency graph at build time — important for
    # vulnerability scanning of the library (not just the CLI binaries).
    #
    # syft 1.42 doesn't expose a --source-version flag for source-directory
    # scans (only --source-name and --source-supplier), so the generated
    # SBOM lists our own module as versionInfo: "UNKNOWN" by default. The
    # wrapper script post-processes with jq to set the correct version.
    # Binary SBOMs don't need this — they read the version from Go's
    # compile-time BuildInfo.
    artifacts: source
    documents: ['${artifact}.sbom.json']
    # Inline pipeline because goreleaser's source-SBOM cataloger runs from
    # the dist/ directory and does NOT substitute $artifact/$document as
    # positional args (only as env vars), so a script wrapper using $1/$2
    # would receive empty strings. Workaround: use the env vars directly
    # and template {{ .Version }} into the jq filter at config-parse time.
    # Depends only on `syft` and `jq` being on $PATH (release workflow
    # ensures both).
    cmd: bash
    args:
      - '-c'
      - 'set -e; syft "$artifact" --output spdx-json="$document"; jq ".packages |= map(if .name == \"github.com/invenity-labs/go-seccure\" then .versionInfo = \"{{ .Version }}\" else . end)" "$document" > "$document.tmp"; mv "$document.tmp" "$document"'

source:
  # Emit a source tarball alongside the binary archives so consumers can
  # rebuild from the exact tagged sources without hitting GitHub's
  # auto-generated archive (which can re-hash if the repo is re-tarred).
  enabled: true

release:
  # The release notes default to the git log since the previous tag. For
  # the first release that just lists every commit on main — fine.
  draft: false
  prerelease: auto
  mode: replace

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
