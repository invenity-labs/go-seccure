# Release pipeline — triggered by pushing a v*.*.* tag.
#
# What this produces, attached to the GitHub Release:
#   - 5 archives (tar.gz for linux/darwin, zip for windows) each containing
#     all 8 seccure-* CLI binaries built for that platform
#   - checksums.txt (SHA-256 over every archive)
#   - One SBOM (SPDX-JSON) per archive
#   - A source tarball + its own SBOM

name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # required for goreleaser to create the GitHub Release
  id-token: write   # for keyless signing if we add cosign later

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs full history for changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          check-latest: true

      - name: Install syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@v0

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          # GITHUB_TOKEN: create the release in this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_TOKEN: push the generated Formula to the
          # invenity-labs/homebrew-tap repo. PAT with `contents:write`
          # scope on that repo. The default GITHUB_TOKEN can't push
          # cross-repo, hence the dedicated secret.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
