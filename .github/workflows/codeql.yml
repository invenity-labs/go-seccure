# GitHub's CodeQL static analysis. Crypto-aware ruleset for Go; findings
# surface as code-scanning alerts on PRs and in the Security tab. Runs on
# every push to main, every PR against main, and once a week so freshly
# published rules catch issues in code that hasn't changed.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 06:00 UTC every Monday
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: codeql / go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          # The 'security-and-quality' suite is broader than the default
          # 'security-extended' — picks up additional code-quality rules
          # that are useful for a crypto library.
          queries: security-and-quality

      - name: Build
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:go'
